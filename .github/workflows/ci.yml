name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python for template lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint bundled A2A-T templates
        run: python tools/template_lint.py --resource-root a2a-t-resources/src/main/resources/prompt_resources

      - name: Build and run tests
        run: mvn -B clean verify

  e2e-samples-unified:
    name: E2E Samples (unified runner)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package project
        run: mvn -B package -DskipTests

      - name: Diagnose LLM config availability
        shell: bash
        run: |
          value="${{ secrets.A2AT_LLM_API_KEY }}"
          len=${#value}
          if [ "$len" -eq 0 ]; then
            echo "::notice::A2AT_LLM_API_KEY is empty, e2e will use mock LLM responses"
          else
            echo "A2AT_LLM_API_KEY length=$len"
          fi

      - name: Fill LLM API keys into all sample envs
        if: ${{ env.A2AT_LLM_API_KEY != '' }}
        env:
          A2AT_LLM_API_KEY: ${{ secrets.A2AT_LLM_API_KEY }}
        run: |
          for f in a2a-t-sample/src/main/resources/sample/*/*/client.env \
                   a2a-t-sample/src/main/resources/sample/*/*/server.env; do
            [ -f "$f" ] || continue
            sed -i "s|^A2AT_LLM_API_KEY=.*|A2AT_LLM_API_KEY=${A2AT_LLM_API_KEY}|" "$f"
          done

      - name: List discovered samples
        run: java @a2a-t-sample/target/sample.args net.openan.a2at.sample.SampleRunner

      - name: Run all samples
        env:
          A2AT_SAMPLE_MAX_ARTIFACTS: "1"
          A2AT_LLM_API_KEY: ${{ secrets.A2AT_LLM_API_KEY }}
        run: |
          set -e
          failed=""
          for sample in $(java @a2a-t-sample/target/sample.args net.openan.a2at.sample.SampleRunner list | grep '  - ' | sed 's/^  - //'); do
            echo "=== running sample: $sample ==="
            if java @a2a-t-sample/target/sample.args net.openan.a2at.sample.SampleRunner "$sample"; then
              echo "sample $sample PASSED"
            else
              echo "::error::sample $sample FAILED"
              failed="$failed $sample"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::failed samples:$failed"
            exit 1
          fi
          echo "all samples PASSED"

      - name: Show sample server logs
        if: always()
        run: |
          for log in a2a-t-sample/target/sample-logs/*-server.log; do
            echo "=== $log ==="
            cat "$log" 2>/dev/null || true
          done
