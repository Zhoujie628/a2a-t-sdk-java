name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python for template lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint bundled A2A-T templates
        run: python tools/template_lint.py --resource-root a2a-t-resources/src/main/resources/prompt_resources

      - name: Build and run tests
        run: mvn -B clean verify

  e2e-test:
    name: E2E Samples Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package project
        run: mvn -B package -DskipTests

      - name: Create server env
        run: |
          cat > server.env << 'EOF'
          A2AT_LANGUAGE=zh-CN
          A2AT_PROMPT_SOURCE_TYPE=local_file
          A2AT_PROMPT_RESOURCE_LOCAL_ROOT_DIR=a2a-t-resources/src/main/resources/prompt_resources
          A2AT_LLM_PROVIDER=openai
          A2AT_LLM_MODEL=deepseek-chat
          A2AT_LLM_BASE_URL=https://api.deepseek.com
          A2AT_LLM_API_KEY=
          A2AT_NEGOTIATION_STATE_STORE_TYPE=in_memory
          A2AT_SAMPLE_HOST=127.0.0.1
          A2AT_SAMPLE_PORT=26335
          REGISTRY_CENTER_HOST=127.0.0.1
          REGISTRY_CENTER_PORT=5001
          EOF
          sed -i 's|^A2AT_LLM_API_KEY=$|A2AT_LLM_API_KEY=${{ secrets.A2AT_LLM_API_KEY }}|' server.env

      - name: Create client env
        run: |
          cat > client.env << 'EOF'
          A2AT_LANGUAGE=zh-CN
          A2AT_PROMPT_SOURCE_TYPE=classpath
          A2AT_PROMPT_RESOURCE_LOCAL_ROOT_DIR=
          A2AT_LLM_PROVIDER=openai
          A2AT_LLM_MODEL=deepseek-chat
          A2AT_LLM_BASE_URL=https://api.deepseek.com
          A2AT_LLM_API_KEY=
          A2AT_NEGOTIATION_STATE_STORE_TYPE=in_memory
          A2AT_SAMPLE_HOST=127.0.0.1
          A2AT_SAMPLE_PORT=26335
          EOF
          sed -i 's|^A2AT_LLM_API_KEY=$|A2AT_LLM_API_KEY=${{ secrets.A2AT_LLM_API_KEY }}|' client.env

      - name: Diagnose LLM config availability
        shell: bash
        run: |
          line=$(grep 'A2AT_LLM_API_KEY=' server.env)
          value=${line#A2AT_LLM_API_KEY=}
          len=${#value}
          if [ "$len" -eq 0 ]; then
            echo "::notice::A2AT_LLM_API_KEY is empty, e2e will use mock LLM responses"
          else
            prefix=$(echo "$value" | cut -c1-12)
            echo "A2AT_LLM_API_KEY length=$len prefix=$prefix..."
          fi

      - name: Start server
        run: |
          nohup java @a2a-t-sample/target/server.javaargs.txt > server.log 2>&1 &
          echo $! > server.pid
          sleep 3

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            if curl -s http://127.0.0.1:26335/ > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... attempt $i"
            sleep 2
          done

      - name: Run client
        env:
          A2AT_SAMPLE_MAX_ARTIFACTS: "5"
        run: |
          java @a2a-t-sample/target/client.javaargs.txt 2>&1 | tee client.log
          artifact_count=$(grep -c 'task-artifact' client.log || true)
          echo "e2e artifacts received: $artifact_count"
          if [ "$artifact_count" -eq 0 ]; then
            echo "::error::e2e failed: no artifacts received"
            exit 1
          fi
          echo "e2e PASSED"

      - name: Show logs
        if: always()
        run: |
          echo "=== server.log ===" && cat server.log 2>/dev/null || true
          echo "=== client.log ===" && cat client.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          kill $(cat server.pid 2>/dev/null) 2>/dev/null || true